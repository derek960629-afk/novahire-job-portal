server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 7d
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: novahire
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/novahire?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    default-property-inclusion: non_null

app:
  seed:
    enabled: ${SEED_DATA:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    root: INFO
    com.novahire: INFO
